<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星球碰撞</title>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

/* ===== 内容区（电脑端固定横屏布局，不做横竖屏判断） ===== */
.landscape-content {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #000;
  color: #e2e8f0;
}

/* ===== 白色开场模块：页面加载先显示，1 秒后淡出消失 ===== */
.intro-panel {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  transition: opacity 0.5s ease;
}
.intro-panel.is-hidden {
  opacity: 0;
  pointer-events: none;
}
.intro-panel .intro-title {
  font-size: 34px;
  font-weight: bold;
  letter-spacing: 8px;
  color: #0f172a;
}
.intro-panel .intro-sub {
  margin-top: 14px;
  font-size: 14px;
  letter-spacing: 5px;
  color: #64748b;
}

/* ===== 星球碰撞舞台 ===== */
.planet-stage {
  position: relative;
  width: 100%;
  height: 60%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.planet {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 130px;
  height: 130px;
  margin: -65px 0 0 -65px;
  border-radius: 50%;
}
/* 左侧星球（蓝） */
.planet--left {
  background: radial-gradient(circle at 35% 30%, #7dd3fc, #0369a1 70%);
  box-shadow: inset -18px -18px 40px rgba(0, 0, 0, .55), 0 0 40px rgba(56, 189, 248, .35);
  transform: translateX(-65vw);
}
/* 右侧星球（红） */
.planet--right {
  background: radial-gradient(circle at 65% 30%, #fca5a5, #b91c1c 70%);
  box-shadow: inset 18px -18px 40px rgba(0, 0, 0, .55), 0 0 40px rgba(248, 113, 113, .35);
  transform: translateX(65vw);
}
/* 碰撞冲击波 */
.shockwave {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 20px;
  height: 20px;
  margin: -10px 0 0 -10px;
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, .85);
  opacity: 0;
  transform: scale(0);
}

/* 触发动画：页面加载 1 秒后由 JS 添加 .playing */
.playing .planet--left { animation: flyLeft 1.3s cubic-bezier(.45, .05, .25, 1) forwards; }
.playing .planet--right { animation: flyRight 1.3s cubic-bezier(.45, .05, .25, 1) forwards; }
.playing .shockwave { animation: shock 0.9s ease-out 2.25s forwards; }

/* 飞入并在中间微微挤压碰撞 */
@keyframes flyLeft {
  0%   { transform: translateX(-65vw); }
  80%  { transform: translateX(-72px); }
  90%  { transform: translateX(-58px); }
  100% { transform: translateX(-66px); }
}
@keyframes flyRight {
  0%   { transform: translateX(65vw); }
  80%  { transform: translateX(72px); }
  90%  { transform: translateX(58px); }
  100% { transform: translateX(66px); }
}
/* 两星球半径 65px，中心间距 132px = 恰好相切碰撞 */
@keyframes shock {
  0%   { opacity: .9; transform: scale(0); }
  100% { opacity: 0;  transform: scale(14); }
}

.caption {
  margin-top: 24px;
  font-size: 18px;
  letter-spacing: 2px;
  color: #94a3b8;
}
  </style>
</head>
<body>
  <!-- 电脑端内容（固定横屏布局） -->
  <div class="landscape-content">
    <!-- 白色开场模块（加载 1 秒后消失） -->
    <div class="intro-panel" id="introPanel">
      <div class="intro-title">星轨交汇</div>
      <div class="intro-sub">LANDSCAPE EXPERIENCE</div>
    </div>
    <div class="planet-stage" id="planetStage">
      <div class="planet planet--left"></div>
      <div class="planet planet--right"></div>
      <div class="shockwave"></div>
    </div>
    <div class="caption">星轨交汇 · 横屏体验</div>
  </div>

  <script>
/*
 * 电脑端专用：页面加载后先显示开场画面，1 秒后淡出并播放星球碰撞动画。
 * 不做横竖屏判断（去掉了 orientation 媒体查询和 resize 重启动画，
 * 避免电脑上窗口变窄时被"请横屏"遮罩挡住、拖动窗口时动画反复重启）。
 */
(function () {
  var stage = document.getElementById('planetStage')
  var intro = document.getElementById('introPanel')

  // 先复位（隐藏播放标记，开场画面回到可见），强制重排后延迟 1 秒触发
  stage.classList.remove('playing')
  intro.classList.remove('is-hidden')
  void stage.offsetWidth

  setTimeout(function () {
    intro.classList.add('is-hidden')
    stage.classList.add('playing')
  }, 1000)
})()
  </script>
</body>
</html>
