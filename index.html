<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#05060D" />
<title>关于我 · 像素自我介绍</title>
<style>
  :root{
    --bg:#05060D;
    --cyan:#5FE3DC;
    --pink:#FF56A6;
    --ink:#E8F4F6;
    --dim:#8FA6B2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
  }
  #space{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;}
  .layer{position:fixed;inset:0;}

  /* ============ 第一幕：横屏提示（完整停留 2 秒后自动进入，无需点击） ============ */
  #hint{
    z-index:40;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 45%, rgba(11,26,38,.94) 0%, rgba(5,6,13,.97) 60%, #05060D 100%);
    transition:opacity .5s ease, visibility .5s ease;
  }
  #hint.gone{opacity:0;visibility:hidden;pointer-events:none;}
  .hint-inner{text-align:center;padding:0 24px;animation:hintIn .5s ease both;}
  @keyframes hintIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:none;}}
  .phone-ico{
    width:78px;height:78px;margin:0 auto 22px;
    display:flex;align-items:center;justify-content:center;
    animation:rotatePhone 2.1s ease-in-out infinite;
  }
  @keyframes rotatePhone{
    0%,18%{transform:rotate(0deg);}
    55%,72%{transform:rotate(-90deg);}
    100%{transform:rotate(0deg);}
  }
  .phone-ico svg{width:100%;height:100%;filter:drop-shadow(0 0 14px rgba(95,227,220,.45));}
  #hint h1{
    margin:0 0 12px;
    font-size:clamp(19px,5.4vw,26px);
    letter-spacing:.16em;
    font-weight:600;
    color:var(--cyan);
    text-shadow:0 0 18px rgba(95,227,220,.55),0 0 42px rgba(95,227,220,.25);
  }
  #hint .sub{margin:0;font-size:13px;letter-spacing:.22em;color:var(--dim);}
  #hint .bar{
    margin:22px auto 0;width:96px;height:2px;border-radius:2px;
    background:rgba(95,227,220,.16);overflow:hidden;
  }
  #hint .bar i{
    display:block;height:100%;width:100%;transform-origin:left center;
    background:linear-gradient(90deg,var(--cyan),var(--pink));
    animation:fill 2s linear forwards;
  }
  @keyframes fill{from{transform:scaleX(0);}to{transform:scaleX(1);}}

  /* ============ 第二幕：角色 + 对话 ============ */
  #talk{
    z-index:20;opacity:0;transition:opacity .55s ease;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:8px;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 18px);
  }
  #talk.show{opacity:1;}
  #talk .char-wrap{
    flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;width:100%;
  }
  #char{
    width:min(78vw,300px);height:auto;
    image-rendering:pixelated;image-rendering:crisp-edges;
    filter:drop-shadow(0 0 16px rgba(95,227,220,.32)) drop-shadow(0 0 34px rgba(255,86,166,.16));
  }
  #talk .bubble-wrap{
    flex:1 1 auto;width:100%;max-width:520px;
    display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0;
  }
  .stage-tag{
    align-self:flex-start;
    font-size:11px;letter-spacing:.18em;padding:4px 10px;border-radius:2px;
    color:var(--cyan);
    border:1px solid rgba(95,227,220,.34);
    background:rgba(95,227,220,.07);
  }
  .bubble{
    position:relative;padding:16px;
    border:1px solid rgba(95,227,220,.34);border-radius:3px;
    background:linear-gradient(160deg, rgba(13,32,45,.92), rgba(9,18,28,.92));
    box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 8px 32px rgba(0,0,0,.45),0 0 26px rgba(95,227,220,.10);
    min-height:104px;display:flex;align-items:center;
  }
  .bubble::before,.bubble::after{
    content:"";position:absolute;width:7px;height:7px;border:1px solid var(--cyan);opacity:.85;
  }
  .bubble::before{left:-1px;top:-1px;border-right:0;border-bottom:0;}
  .bubble::after{right:-1px;bottom:-1px;border-left:0;border-top:0;}
  .bubble .text{
    font-size:clamp(15px,4.2vw,18px);line-height:1.95;letter-spacing:.03em;color:#E8F4F6;
  }
  .caret{
    display:inline-block;width:7px;height:1.05em;margin-left:3px;
    background:var(--cyan);vertical-align:-2px;
    animation:blinkCaret .9s steps(1) infinite;
  }
  @keyframes blinkCaret{0%,50%{opacity:.9;}51%,100%{opacity:0;}}
  .bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .dots{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
  .dots i{
    width:5px;height:5px;border-radius:1px;background:rgba(143,166,178,.30);
    transition:background .2s,box-shadow .2s;
  }
  .dots i.on{background:var(--cyan);box-shadow:0 0 8px rgba(95,227,220,.8);}
  .tap-hint{
    font-size:11px;letter-spacing:.16em;color:var(--dim);white-space:nowrap;
    animation:pulseHint 2.2s ease-in-out infinite;
  }
  @keyframes pulseHint{0%,100%{opacity:.45;}50%{opacity:.95;}}

  .ripple{
    position:fixed;z-index:25;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
    border:1px solid rgba(95,227,220,.9);pointer-events:none;
    animation:rippleOut .7s ease-out forwards;
  }
  @keyframes rippleOut{to{transform:scale(7);opacity:0;}}

  /* ============ 第三幕：结尾（左角色 / 右简介，无滚动条、无重看按钮） ============ */
  #ending{
    z-index:30;opacity:0;transition:opacity .6s ease;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 14px);
    overflow:hidden;
  }
  #ending.show{opacity:1;}
  .ending-left{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;}
  #charEnd{
    width:min(38vw,150px);height:auto;
    image-rendering:pixelated;image-rendering:crisp-edges;
    filter:drop-shadow(0 0 14px rgba(95,227,220,.28));
  }
  .ending-right{
    flex:1 1 auto;min-height:0;width:100%;max-width:640px;
    display:flex;flex-direction:column;justify-content:center;gap:8px;
  }
  .ending-title{
    margin:0;font-size:clamp(15px,4vw,19px);letter-spacing:.18em;font-weight:600;
    color:var(--cyan);text-shadow:0 0 16px rgba(95,227,220,.5);
    display:flex;align-items:center;gap:10px;
  }
  .ending-title::after{
    content:"";flex:1;height:1px;
    background:linear-gradient(90deg,rgba(95,227,220,.5),rgba(255,86,166,.25),transparent);
  }
  .groups{display:grid;grid-template-columns:1fr;gap:7px;align-content:start;}
  .group{
    border:1px solid rgba(95,227,220,.18);
    background:linear-gradient(150deg, rgba(12,28,40,.72), rgba(8,14,22,.72));
    padding:7px 9px;border-radius:2px;position:relative;
  }
  .group::before{
    content:"";position:absolute;left:-1px;top:-1px;width:6px;height:6px;
    border:1px solid rgba(95,227,220,.7);border-right:0;border-bottom:0;
  }
  .gtitle{font-size:10px;letter-spacing:.2em;color:var(--pink);margin-bottom:4px;}
  .gline{margin:0;font-size:clamp(11.5px,3.3vw,14px);line-height:1.62;color:#D9E9EE;letter-spacing:.02em;}
  .gline + .gline{margin-top:3px;}
  .ending-foot{margin-top:2px;font-size:10px;letter-spacing:.18em;color:rgba(143,166,178,.55);text-align:right;}

  /* ============ 竖屏设备：开场提示之后整体旋转 90°，强制横屏占满全屏 ============ */
  @media (orientation:portrait){
    body.rotd{
      position:fixed;top:0;left:100%;
      width:100vh;height:100vw;
      transform-origin:left top;
      transform:rotate(90deg);
      transition:transform .55s ease;
    }
    /* 旋转后 body 的宽=屏高(844)、高=屏宽(390)：横向尺寸用 vh，纵向尺寸用 vw */
    body.rotd #talk{
      flex-direction:row;align-items:center;justify-content:center;
      gap:2.4vh;
      padding:2vw 3vh;
    }
    body.rotd #talk .char-wrap{width:auto;height:auto;flex:0 0 auto;align-items:center;}
    body.rotd #char{width:min(30vh,255px);}
    body.rotd #talk .bubble-wrap{width:min(52vh,520px);max-width:none;gap:1.4vw;}
    body.rotd .bubble{min-height:0;padding:2vw 2.2vh;max-height:62vw;overflow:hidden;}
    body.rotd .bubble .text{font-size:clamp(13px,3.3vw,17px);line-height:1.8;}
    body.rotd .stage-tag{font-size:clamp(9.5px,2.5vw,11px);}
    body.rotd .tap-hint{font-size:clamp(9px,2.4vw,11px);}
    body.rotd .dots i{width:4px;height:4px;}
    body.rotd #ending{
      flex-direction:row;align-items:center;justify-content:center;
      gap:3vh;
      padding:2vw 3vh;
    }
    body.rotd .ending-left{height:auto;align-items:center;}
    body.rotd #charEnd{width:min(22vh,180px);}
    body.rotd .ending-right{width:min(70vh,790px);max-width:none;gap:1vw;}
    body.rotd .ending-title{font-size:clamp(13px,3vw,17px);}
    body.rotd .groups{grid-template-columns:repeat(3,minmax(0,1fr));gap:0.8vw;}
    body.rotd .gline{font-size:clamp(9.5px,2.35vw,12px);line-height:1.42;}
    body.rotd .group{padding:1.3vw 1.4vw;}
    body.rotd .gtitle{font-size:clamp(8.5px,2.2vw,10px);margin-bottom:2px;}
    body.rotd .ending-foot{font-size:clamp(8px,2vw,10px);}
  }

  /* ============ 横屏 / 宽屏 ============ */
  @media (orientation:landscape), (min-aspect-ratio:1/1){
    #talk{
      flex-direction:row;align-items:center;gap:clamp(14px,4vw,46px);
      padding:calc(env(safe-area-inset-top) + 14px) 26px calc(env(safe-area-inset-bottom) + 14px);
    }
    #talk .char-wrap{width:auto;flex:0 0 auto;}
    #char{width:min(36vw,320px);}
    #talk .bubble-wrap{max-width:520px;}
    .bubble{min-height:120px;}

    #ending{
      flex-direction:row;align-items:center;gap:clamp(16px,3.5vw,40px);
      padding:calc(env(safe-area-inset-top) + 18px) clamp(18px,4vw,42px) calc(env(safe-area-inset-bottom) + 18px);
    }
    #charEnd{width:min(22vw,185px);}
    .groups{grid-template-columns:repeat(2,minmax(0,1fr));}
    .ending-right{max-width:760px;}
  }
  @media (min-width:900px){
    .groups{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
  .hidden{display:none !important;}

  /* 音乐开关 */
  #muteBtn{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:70;
    width:36px;height:36px;border-radius:50%;border:1px solid rgba(120,220,220,.38);
    background:rgba(8,22,33,.55);color:#9fe8e2;font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center;padding:0;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer;
    transition:color .25s,border-color .25s,transform .2s;
    font-family:inherit;-webkit-tap-highlight-color:transparent;
  }
  #muteBtn.off{color:#5f7c85;border-color:rgba(110,150,160,.22);}
  #muteBtn.on{animation:pulseMusic 2.4s ease-in-out infinite;}
  @keyframes pulseMusic{0%,100%{box-shadow:0 0 0 0 rgba(95,227,220,.28);}50%{box-shadow:0 0 0 7px rgba(95,227,220,0);}}
  body.rotd #muteBtn{top:2.4vh;left:2.4vh;right:auto;}

  /* 结尾页小游戏入口：浮动在右下角，不占自我介绍文档流 */
  .ending-games{
    position:absolute;right:2.2vh;bottom:2.2vh;z-index:5;
    display:flex;gap:1.2vw;flex-wrap:wrap;justify-content:flex-end;
  }
  .ending-games button{
    padding:0.7vw 1.6vw;border-radius:999px;cursor:pointer;
    background:rgba(95,227,220,.10);color:#b8f0ec;
    border:1px solid rgba(95,227,220,.45);font-size:clamp(10px,2.6vw,13px);
    font-family:inherit;letter-spacing:.05em;transition:.2s;
    -webkit-tap-highlight-color:transparent;
  }
  .ending-games button:active{transform:scale(.96);background:rgba(95,227,220,.22);}

  /* 游戏层通用 */
  #gameStars, #gameTarot{
    background:radial-gradient(ellipse at center,#0a1a2b 0%,#050b14 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;
    z-index:80;
  }
  #starsCv{
    position:absolute;inset:0;width:100%;height:100%;
    touch-action:none;user-select:none;-webkit-user-select:none;display:block;
  }
  .game-hud{
    position:absolute;top:2vh;left:2vw;right:2vw;
    display:flex;justify-content:space-between;color:#9fe8e2;
    font-size:clamp(11px,2.6vw,14px);z-index:2;pointer-events:none;
  }
  .game-msg{
    position:absolute;top:18vh;left:50%;transform:translateX(-50%);
    color:#fff;font-size:clamp(14px,3.4vw,18px);text-shadow:0 0 12px rgba(95,227,220,.6);
    z-index:2;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
  }
  .game-msg.show{opacity:1;}
  .game-close{
    position:absolute;top:2vh;right:2vw;width:32px;height:32px;border-radius:50%;
    background:rgba(10,26,38,.6);border:1px solid rgba(120,220,220,.35);color:#9fe8e2;
    font-size:14px;cursor:pointer;z-index:3;
  }
  .game-tip{
    position:absolute;bottom:2.2vh;left:50%;transform:translateX(-50%);
    color:rgba(159,232,226,.55);font-size:clamp(9px,2.4vw,12px);letter-spacing:.15em;
    pointer-events:none;z-index:2;
  }

  /* 塔罗：横屏左右布局，左牌右运势 */
  #gameTarot{flex-direction:row;gap:4vw;align-items:center;justify-content:center;padding:0 4vw;}
  .tarot-left{display:flex;flex-direction:column;align-items:center;gap:1.4vh;flex:0 0 auto;}
  .tarot-title{color:#9fe8e2;font-size:clamp(13px,3.2vw,17px);letter-spacing:.3em;}
  .tarot-stage{perspective:1000px;}
  .tarot-card{
    width:clamp(120px,24vh,180px);height:clamp(180px,38vh,270px);
    position:relative;cursor:pointer;transform-style:preserve-3d;
    filter:drop-shadow(0 10px 24px rgba(0,0,0,.45));
  }
  .tarot-card .inner{
    width:100%;height:100%;position:relative;
    transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);
  }
  .tarot-card.flipped .inner{transform:rotateY(180deg);}
  .tarot-card .face{
    position:absolute;inset:0;border-radius:12px;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(159,232,226,.5);
  }
  .tarot-card .back{
    background:
      radial-gradient(circle at 30% 30%, rgba(95,227,220,.28), transparent 60%),
      repeating-linear-gradient(45deg, rgba(159,232,226,.06) 0 8px, transparent 8px 16px),
      linear-gradient(135deg,#10283f,#1b1030);
    color:rgba(159,232,226,.8);font-size:48px;letter-spacing:.1em;
  }
  .tarot-card .front{
    background:linear-gradient(160deg,#f6e8d8,#d9b8c8);
    transform:rotateY(180deg);
    flex-direction:column;gap:1vh;padding:1.2vh;
  }
  .tarot-card .front .icon{font-size:clamp(56px,15vh,96px);filter:drop-shadow(0 4px 12px rgba(0,0,0,.25));}
  .tarot-card .front .num{font-size:clamp(9px,2.2vw,11px);color:#7a5a6e;letter-spacing:.3em;}

  .tarot-right{
    flex:0 1 auto;max-width:min(46vw,520px);
    background:rgba(15,32,48,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(159,232,226,.22);border-radius:14px;
    padding:2vh 2vw;display:flex;flex-direction:column;gap:1.2vh;
  }
  .tarot-name{color:#ffe9c8;font-size:clamp(13px,3vw,17px);letter-spacing:.22em;text-align:center;min-height:1.4em;}
  .tarot-mean{
    color:rgba(232,244,246,.92);font-size:clamp(11px,2.7vw,14px);
    line-height:1.65;text-align:center;min-height:2.4em;
  }
  .tarot-grid{display:grid;grid-template-columns:1fr 1fr;gap:1vh 1.4vw;}
  .tarot-cell{
    background:rgba(95,227,220,.07);border-left:2px solid rgba(95,227,220,.45);
    padding:1vh .9vw;border-radius:0 8px 8px 0;
  }
  .tarot-cell.k{font-size:clamp(9px,2.3vw,11px);color:#9fe8e2;letter-spacing:.18em;margin-bottom:4px;}
  .tarot-cell.v{font-size:clamp(10.5px,2.6vw,13px);color:rgba(240,248,250,.92);line-height:1.55;}
  .tarot-btns{display:flex;gap:1.5vw;justify-content:center;margin-top:.4vh;}
  .tarot-btns button{
    padding:0.9vh 2.2vw;border-radius:999px;cursor:pointer;
    background:rgba(255,168,203,.15);color:#ffd1e5;border:1px solid rgba(255,168,203,.5);
    font-size:clamp(10px,2.6vw,13px);font-family:inherit;letter-spacing:.1em;
  }
  .tarot-btns button:active{transform:scale(.96);}
  /* 竖屏时游戏层临时旋转到横屏 */
  @media (orientation:portrait){
    #gameStars{
      position:fixed;top:0;left:100%;right:auto;bottom:auto;
      width:100vh;height:100vw;
      transform-origin:left top;transform:rotate(90deg);
    }
    #gameTarot{
      position:fixed;top:0;left:100%;right:auto;bottom:auto;
      width:100vh;height:100vw;
      transform-origin:left top;transform:rotate(90deg);
    }
  }
</style>
</head>
<body>

<canvas id="space"></canvas>

<audio id="bgm" loop preload="auto" playsinline autoplay muted></audio>
<button id="muteBtn" aria-label="背景音乐开关">♪</button>

<div id="hint" class="layer">
  <div class="hint-inner">
    <div class="phone-ico">
      <svg viewBox="0 0 48 48" fill="none" stroke="#5FE3DC" stroke-width="2">
        <rect x="16" y="6" width="16" height="30" rx="3" stroke-linecap="round"/>
        <line x1="22" y1="31" x2="26" y2="31" stroke-linecap="round"/>
        <path d="M9 26 A 16 16 0 0 1 9 14" stroke-dasharray="3 3" opacity=".6"/>
        <path d="M39 22 A 16 16 0 0 0 39 34" stroke-dasharray="3 3" opacity=".6"/>
        <path d="M6 16 l-2.5 -3 l4.5 -1" opacity=".6"/>
        <path d="M42 38 l2.5 3 l-4.5 1" opacity=".6"/>
      </svg>
    </div>
    <h1>建议横屏观看</h1>
    <p class="sub">即将进入</p>
    <div class="bar"><i></i></div>
  </div>
</div>

<section id="talk" class="layer hidden">
  <div class="char-wrap">
    <canvas id="char" width="96" height="104"></canvas>
  </div>
  <div class="bubble-wrap">
    <div class="stage-tag" id="stageTag">关于我</div>
    <div class="bubble"><span class="text" id="lineText"></span><span class="caret" id="caret"></span></div>
    <div class="bar-row">
      <div class="dots" id="dots"></div>
      <div class="tap-hint">轻触屏幕继续 ›</div>
    </div>
  </div>
</section>

<section id="ending" class="layer hidden">
  <div class="ending-left">
    <canvas id="charEnd" width="96" height="104"></canvas>
  </div>
  <div class="ending-right">
    <h2 class="ending-title">我的自我介绍</h2>
    <div class="groups" id="groups"></div>
    <div class="ending-foot">THE END · 很高兴遇见你</div>
  </div>
  <div class="ending-games">
    <button id="openStars">🌠 捡星星</button>
    <button id="openTarot">🔮 今日塔罗</button>
  </div>
</section>

<section id="gameStars" class="layer hidden">
  <canvas id="starsCv"></canvas>
  <div class="game-hud">
    <div class="hud-score">得分 <b id="starsScore">0</b></div>
    <div class="hud-time"><b id="starsTime">15</b>s</div>
  </div>
  <div class="game-msg" id="starsMsg"></div>
  <div class="game-tip">手指按住屏幕左右滑动 · 接住掉落的星星</div>
  <button class="game-close" data-close>✕</button>
</section>

<section id="gameTarot" class="layer hidden">

/* =========================================================

const rand = (a,b)=> a + Math.random()*(b-a);
const randInt = (a,b)=> Math.floor(rand(a,b+1));
const clamp = (v,a,b)=> Math.max(a, Math.min(b,v));
const easeInOut = t => t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const nowMs = ()=> performance.now();

/* =========================================================

let stars = [];
let nebulaCache = null;

function buildStars(){
  const n = Math.round(clamp((W*H)/5200, 90, 240));
  stars = [];
  for (let i=0;i<n;i++){
    stars.push({
      x: Math.random()*W, y: Math.random()*H,
      s: Math.random()<0.82 ? 1 : 2,
      ph: Math.random()*Math.PI*2,
      sp: rand(0.0006, 0.0022),
      base: rand(0.25, 0.95),

}

function buildNebula(){
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const g = off.getContext('2d');

  const bg = g.createLinearGradient(0,0,W*0.4,H);
  bg.addColorStop(0, '#070B16');
  bg.addColorStop(0.55, '#05060F');
  bg.addColorStop(1, '#08060F');
  g.fillStyle = bg; g.fillRect(0,0,W,H);

  const blob = (x,y,r,color,a)=>{
    const rg = g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0, color.replace('__A__', a));
    rg.addColorStop(0.55, color.replace('__A__', a*0.35));
    rg.addColorStop(1, color.replace('__A__', '0'));
    g.fillStyle = rg;
    g.fillRect(x-r,y-r,r*2,r*2);
  };
  blob(W*0.18, H*0.22, Math.max(W,H)*0.55, 'rgba(28,116,150,__A__)', 0.30);
  blob(W*0.86, H*0.30, Math.max(W,H)*0.48, 'rgba(120,26,96,__A__)', 0.24);
  blob(W*0.55, H*0.92, Math.max(W,H)*0.5,  'rgba(20,62,110,__A__)', 0.22);

  g.globalAlpha = 0.5;
  for (let i=0;i<Math.round(W*H/3600);i++){
    const x = Math.random()*W, y = Math.random()*H;
    g.fillStyle = Math.random()<0.2 ? 'rgba(255,86,166,0.35)' : 'rgba(95,227,220,0.32)';
    g.fillRect(x, y, 1, 1);
  }
  g.globalAlpha = 1;
  nebulaCache = off;
}

function drawStars(t){
  for (const s of stars){
    const tw = 0.6 + 0.4*Math.sin(t*s.sp + s.ph);
    const a = s.base * tw;
    sctx.fillStyle = s.hue==='pink'
      ? 'rgba(255,110,175,' + a.toFixed(3) + ')'
      : (s.hue==='cyan' ? 'rgba(120,235,228,' + a.toFixed(3) + ')' : 'rgba(226,240,248,' + a.toFixed(3) + ')');
    sctx.fillRect(s.x, s.y, s.s, s.s);
  }
}

/* =========================================================
   3. 点阵星球
   ========================================================= */
const SPHERE_N = 520;

function makeDotSphere(n){
  const pts = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i=0;i<n;i++){
    const y = 1 - (i/(n-1))*2;
    const r = Math.sqrt(Math.max(0, 1-y*y));
    const th = golden * i;
    let rr = 1;
    if (Math.random() < 0.28) rr = rand(0.55, 0.98);
    pts.push({
      x: Math.cos(th)*r*rr,
      y: y*rr,
      z: Math.sin(th)*r*rr,
      j: rand(0, Math.PI*2)
    });
  }
  return pts;
}

const planets = [
  { pts: makeDotSphere(SPHERE_N), hue:'cyan', rot: 0,   rotSp: 0.0016, trail: [], cx:0, cy:0, R:60, homeX:0, homeY:0 },
  { pts: makeDotSphere(SPHERE_N), hue:'pink', rot: 1.2, rotSp: -0.0014, trail: [], cx:0, cy:0, R:60, homeX:0, homeY:0 }
];

const COLOR = {
  cyan: { core:'rgba(150,255,248,AL)', mid:'rgba(70,216,208,AL)', dim:'rgba(24,112,124,AL)', glow:'rgba(95,227,220,AL)' },
  pink: { core:'rgba(255,214,238,AL)', mid:'rgba(255,116,194,AL)', dim:'rgba(124,32,92,AL)',  glow:'rgba(255,86,166,AL)' }
};

function drawDotSphere(pl, t){
  const c = COLOR[pl.hue];
  const cosR = Math.cos(pl.rot), sinR = Math.sin(pl.rot);

  const g = sctx.createRadialGradient(pl.cx, pl.cy, pl.R*0.5, pl.cx, pl.cy, pl.R*1.5);
  g.addColorStop(0, c.glow.replace('AL', '0.16'));
  g.addColorStop(0.55, c.glow.replace('AL', '0.06'));
  g.addColorStop(1, c.glow.replace('AL', '0'));
  sctx.fillStyle = g;
  sctx.beginPath(); sctx.arc(pl.cx, pl.cy, pl.R*1.5, 0, Math.PI*2); sctx.fill();

  for (const p of pl.pts){
    const rx = p.x*cosR - p.z*sinR;
    const rz = p.x*sinR + p.z*cosR;
    const depth = (rz + 1) / 2;
    const sx = pl.cx + rx * pl.R;
    const sy = pl.cy + p.y * pl.R;
    const twinkle = 0.86 + 0.14*Math.sin(t*0.004 + p.j);

    let col, size;
    if (depth > 0.72){ col = c.core.replace('AL', (0.95*twinkle).toFixed(3)); size = 2; }
    else if (depth > 0.45){ col = c.mid.replace('AL', (0.74*twinkle).toFixed(3)); size = 2; }
    else if (depth > 0.18){ col = c.mid.replace('AL', (0.42*twinkle).toFixed(3)); size = 1; }
    else { col = c.dim.replace('AL', (0.24*twinkle).toFixed(3)); size = 1; }
    sctx.fillStyle = col;
    sctx.fillRect(Math.round(sx), Math.round(sy), size, size);
  }

  for (let i=0;i<30;i++){
    const ang = (i/30)*Math.PI*2 + pl.rot;
    const rr = pl.R * (0.985 + 0.02*Math.sin(t*0.003 + i));
    sctx.fillStyle = c.core.replace('AL', '0.5');
    sctx.fillRect(Math.round(pl.cx + Math.cos(ang)*rr), Math.round(pl.cy + Math.sin(ang)*rr), 1, 1);
  }
}

let boom = null;

function startBoom(x, y){
  const parts = [];
  for (let i=0;i<300;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = rand(0.6, 5.2) * (Math.random()<0.16 ? 2.1 : 1);
    const isPink = Math.random() < 0.42;
    parts.push({
      x: x + rand(-6,6), y: y + rand(-6,6),
      vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd*0.92,
      life: rand(1.2, 2.6), age: 0,
      size: Math.random()<0.5 ? 2 : 3,
      col: isPink
        ? (Math.random()<0.5 ? 'rgba(255,120,196,' : 'rgba(255,190,226,')
        : (Math.random()<0.5 ? 'rgba(120,240,232,' : 'rgba(200,255,250,')
    });
    parts[parts.length-1].col += 'AL)';
  }
  boom = {
    t: 0, parts,
    rings: [
      { r: 8,  life: 2.2, w: 7 },
      { r: 14, life: 2.7, w: 5 },
      { r: 22, life: 3.2, w: 3 }
    ],
    flash: 1
  };
}

function updateBoom(dt, cx, cy){
  if (!boom) return;
  boom.t += dt;

  for (const p of boom.parts){
    p.age += dt;
    if (p.age > p.life) continue;
    p.x += p.vx * dt * 60 * 0.34;
    p.y += p.vy * dt * 60 * 0.34;
    p.vx *= 0.955; p.vy *= 0.955;
    const k = 1 - p.age/p.life;
    sctx.fillStyle = p.col.replace('AL', (k*k).toFixed(3));
    sctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  }

  for (const r of boom.rings){
    const k = clamp(boom.t / r.life, 0, 1);
    const rad = r.r + easeInOut(k) * (Math.min(W,H)*0.62);
    const a = (1-k)*(1-k);
    sctx.strokeStyle = 'rgba(150,246,240,' + (a*0.55).toFixed(3) + ')';
    sctx.lineWidth = Math.max(0.6, r.w * (1-k));
    sctx.beginPath(); sctx.arc(cx, cy, rad, 0, Math.PI*2); sctx.stroke();

    sctx.strokeStyle = 'rgba(255,120,196,' + (a*0.30).toFixed(3) + ')';
    sctx.lineWidth = Math.max(0.5, (r.w*0.6) * (1-k));
    sctx.beginPath(); sctx.arc(cx, cy, rad*0.86, 0, Math.PI*2); sctx.stroke();
  }

  const coreK = clamp(1 - boom.t/1.3, 0, 1);
  if (coreK > 0){
    const g = sctx.createRadialGradient(cx, cy, 0, cx, cy, 90*(0.4+boom.t));
    g.addColorStop(0, 'rgba(255,255,255,' + coreK.toFixed(3) + ')');
    g.addColorStop(0.25, 'rgba(175,255,250,' + (coreK*0.8).toFixed(3) + ')');
    g.addColorStop(0.6, 'rgba(120,220,255,' + (coreK*0.28).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(60,120,200,0)');
    sctx.fillStyle = g;
    sctx.beginPath(); sctx.arc(cx, cy, 90*(0.4+boom.t), 0, Math.PI*2); sctx.fill();
  }

  if (boom.flash > 0){
    boom.flash = Math.max(0, boom.flash - dt*1.15);
    sctx.fillStyle = 'rgba(235,252,255,' + (boom.flash*0.85).toFixed(3) + ')';
    sctx.fillRect(0,0,W,H);
  }
}

/* ===== 碰撞后融合成的点阵巨行星（青+粉双色、条带状） ===== */
let mergeBall = null;
let mergeT0 = 0;

function startMerge(t){
  mergeBall = {
    R: planets[0].R * 1.62,
    rot: 0,
    pts: makeDotSphere(940)
  };
  mergeT0 = t;
}

function drawMergeBall(t){
  if (!mergeBall) return;
  const m = mergeBall;
  const grow = clamp((t - mergeT0) / MERGE_GROW_MS, 0, 1);
  const R = m.R * (0.5 + 0.5 * easeInOut(grow));
  m.rot += 0.0015;

  const cx = collisionX, cy = collisionY;

  const g = sctx.createRadialGradient(cx, cy, R*0.55, cx, cy, R*2.05);
  g.addColorStop(0, 'rgba(160,240,235,0.22)');
  g.addColorStop(0.42, 'rgba(190,145,220,0.11)');
  g.addColorStop(1, 'rgba(255,120,200,0)');
  sctx.fillStyle = g;
  sctx.beginPath(); sctx.arc(cx, cy, R*2.05, 0, Math.PI*2); sctx.fill();

  const cosR = Math.cos(m.rot), sinR = Math.sin(m.rot);
  for (const p of m.pts){
    const rx = p.x*cosR - p.z*sinR;
    const rz = p.x*sinR + p.z*cosR;
    const depth = (rz + 1) / 2;
    const sx = cx + rx * R;
    const sy = cy + p.y * R;

    const bandPhase = Math.sin(p.y * 6.6 + Math.sin(m.rot * 0.8) * 0.6);
    const density = Math.pow(clamp(0.5 + 0.5 * bandPhase, 0, 1), 1.5);
    const mix = clamp(0.5 + 0.5 * Math.sin(p.y * 2.4 + 0.8), 0, 1);
    const cr = Math.round(95 + (255 - 95) * mix);
    const cg = Math.round(227 + (86 - 227) * mix);
    const cb = Math.round(220 + (166 - 220) * mix);
    const a = Math.max(0, (0.12 + depth * 0.88) * (0.18 + 0.82 * density) * (0.35 + 0.65*grow));
    sctx.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + a.toFixed(3) + ')';
    const sz = (density > 0.55 && depth > 0.4) ? 2 : 1;
    sctx.fillRect(Math.round(sx), Math.round(sy), sz, sz);
  }

  sctx.strokeStyle = 'rgba(225,250,255,' + (0.15 * grow).toFixed(3) + ')';
  sctx.lineWidth = 1.2;
  sctx.beginPath(); sctx.arc(cx, cy, R*0.995, 0, Math.PI*2); sctx.stroke();

  if (phase === 'merge'){
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.004);
    sctx.fillStyle = 'rgba(232,244,246,' + (0.45 + pulse*0.45).toFixed(3) + ')';
    sctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
    sctx.textAlign = 'center';
    sctx.fillText('轻触星球 · 继续', cx, cy + R * 1.6);
  }
}

function enterTalk(){
  if (phase !== 'merge') return;
  phase = 'talk'; phaseT0 = nowMs();

}

/* ===== 背景音乐 & 点击音效 ===== */
let actx = null, muted = false, musicStarted = false, bgmIdx = 0;
const bgmEl = document.getElementById('bgm');
const muteBtn = document.getElementById('muteBtn');
const BGM_LIST = ['music/faruxue.mp3', 'music/发如雪.mp3', 'music/bgm.mp3', 'bgm.mp3'];

/* 页面一加载就预加载 + 尝试自动播放（muted 自动播是浏览器允许的，播起来后立即尝试取消静音） */
(function preloadBgm(){
  try{
    bgmEl.src = BGM_LIST[0];
    bgmEl.preload = 'auto';
    bgmEl.muted = true;
    bgmEl.play().catch(()=>{});

    bgmEl.addEventListener('play', ()=>{
      setTimeout(()=>{ try{ bgmEl.muted = false; }catch(e){} }, 50);
      if (!musicStarted){
        musicStarted = true;
        playBgm();
        muteBtn.classList.add('on');
      }
    });
  }catch(e){}
})();

function initAudio(){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }catch(e){}
}

function blip(freq, dur, type, vol){
  initAudio();
  if (!actx || muted) return;
  try{
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.linearRampToValueAtTime(vol == null ? 0.08 : vol, actx.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(actx.currentTime);
    o.stop(actx.currentTime + dur + 0.02);
  }catch(e){}
}

/* ===== 兜底：只有 BGM_LIST 里所有文件都 404 时，才用 WebAudio 合成一段氛围乐 ===== */
let ambient = null;
const PENTA = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25];
const PAD_FREQS = [130.81, 164.81, 196.0, 261.63];

function makeImpulse(dur, decay){
  const rate = actx.sampleRate;
  const len = Math.floor(rate * dur);
  const buf = actx.createBuffer(1, len, rate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++){
    const x = 1 - i / len;
    d[i] = (Math.random() * 2 - 1) * Math.pow(x, decay);
  }
  return buf;
}

function startAmbient(){
  if (ambient || !actx) return;
  const ctx = actx;
  const master = ctx.createGain();
  master.gain.setValueAtTime(0, ctx.currentTime);
  master.gain.linearRampToValueAtTime(muted ? 0 : 0.30, ctx.currentTime + 4);
  master.connect(ctx.destination);

  const conv = ctx.createConvolver();
  conv.buffer = makeImpulse(3.6, 1.35);
  const wet = ctx.createGain();
  wet.gain.value = 0.45;
  conv.connect(wet);
  wet.connect(master);

  const padGain = ctx.createGain();
  padGain.gain.value = 0.40;
  padGain.connect(master);
  padGain.connect(conv);

  const nodes = [];
  PAD_FREQS.forEach((f, i) => {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f + (i === 3 ? -0.7 : 0.5);
    const g = ctx.createGain();
    g.gain.value = i === 3 ? 0.05 : 0.08;
    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.06 + i * 0.017;
    const lfoG = ctx.createGain();
    lfoG.gain.value = 0.028;
    lfo.connect(lfoG);
    lfoG.connect(g.gain);
    o.connect(g);
    g.connect(padGain);
    o.start();
    lfo.start();
    nodes.push(o, lfo);
  });

  const a = { master, conv, padGain, nodes, noteTimer: null, stopped: false };
  ambient = a;

  function pluck(f, vel){
    if (a.stopped) return;
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    const g = ctx.createGain();
    const t0 = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vel, t0 + 0.035);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
    o.connect(g);
    g.connect(master);
    g.connect(conv);
    o.start(t0);
    o.stop(t0 + 1.0);
  }

  function loopNotes(){
    if (a.stopped) return;
    const f = PENTA[Math.floor(Math.random() * PENTA.length)];
    pluck(f, 0.026 + Math.random() * 0.026);
    if (Math.random() < 0.22) pluck(f * 1.498, 0.011);
    a.noteTimer = setTimeout(loopNotes, 640 + Math.random() * 780);
  }
  a.noteTimer = setTimeout(loopNotes, 700);
}

function stopAmbient(){
  if (!ambient) return;
  const a = ambient;
  ambient = null;
  a.stopped = true;
  clearTimeout(a.noteTimer);
  try{
    a.master.gain.cancelScheduledValues(actx.currentTime);
    a.master.gain.setValueAtTime(a.master.gain.value, actx.currentTime);
    a.master.gain.linearRampToValueAtTime(0, actx.currentTime + 0.6);
  }catch(e){}
  setTimeout(() => {
    a.nodes.forEach(n => { try{ n.stop(); }catch(e){} });
  }, 800);
}

function applyMuteLevel(){
  if (actx && ambient){
    try{
      ambient.master.gain.cancelScheduledValues(actx.currentTime);
      ambient.master.gain.setValueAtTime(ambient.master.gain.value, actx.currentTime);
      ambient.master.gain.linearRampToValueAtTime(muted ? 0 : 0.30, actx.currentTime + 0.4);
    }catch(e){}
  }
}

function playBgm(){
  if (muted) return;
  try{
    bgmEl.muted = false;
    if (bgmEl.volume < 0.001) bgmEl.volume = 0.001;
  }catch(e){}
  const p = bgmEl.play();
  if (p && p.catch) p.catch(()=>{});
  let v = bgmEl.volume;
  const fade = setInterval(()=>{
    v += 0.06;
    try{ bgmEl.volume = Math.min(0.42, v); }catch(e){}
    if (v >= 0.42) clearInterval(fade);
  }, 120);
}

function tryNextBgm(){
  bgmIdx++;
  if (bgmIdx < BGM_LIST.length){
    try{ bgmEl.src = BGM_LIST[bgmIdx]; bgmEl.load(); }catch(e){}
    if (musicStarted) playBgm();
  } else {
    /* 所有 mp3 都加载失败，才启用合成氛围音 */
    startAmbient();
  }
}

bgmEl.addEventListener('canplay', ()=>{

});

bgmEl.addEventListener('error', ()=>{ tryNextBgm(); });

/* =========================================================
   4. 阶段调度
   ========================================================= */
const HINT_MS = 2000;   // 完整停留 2 秒
const FLY_MS  = 2200;   // 两颗星球从屏幕两侧慢慢靠近
const BOOM_MS = 1500;   // 爆炸场面
const MERGE_GROW_MS = 1300;  // 融合星球长成的时长

let phase = 'hint';
let phaseT0 = nowMs();
let collisionX = 0, collisionY = 0;
let shake = 0;

function resetPlanetPositions(){
  const R = clamp(Math.min(W,H) * 0.155, 44, 92);
  planets[0].R = R; planets[1].R = R;
  collisionX = W * 0.5;
  collisionY = H * 0.44;
  // 起点放在屏幕左右两侧边缘内侧，保证能看清两边一起靠近
  planets[0].homeX = R * 0.72; planets[0].homeY = collisionY;
  planets[1].homeX = W - R * 0.72; planets[1].homeY = collisionY;
  planets[0].cx = planets[0].homeX; planets[0].cy = planets[0].homeY;
  planets[1].cx = planets[1].homeX; planets[1].cy = planets[1].homeY;
}

function goFly(){ phase = 'fly'; phaseT0 = nowMs(); applyOrientation(); }

function tickPhases(t){
  const el = t - phaseT0;

  if (phase === 'hint' && el >= HINT_MS) goFly();

  if (phase === 'fly'){
    const p = clamp(el / FLY_MS, 0, 1);
    const e = easeInOut(p);
    const R = planets[0].R;
    planets[0].cx = planets[0].homeX + (collisionX - R*0.86 - planets[0].homeX) * e;
    planets[1].cx = planets[1].homeX + (collisionX + R*0.86 - planets[1].homeX) * e;
    planets[0].cy = planets[0].homeY;
    planets[1].cy = planets[1].homeY;

    for (const pl of planets){
      pl.rot += pl.rotSp * 12;
      if (Math.random() < 0.35){
        pl.trail.push({
          x: pl.cx + rand(-pl.R, pl.R)*0.6,
          y: pl.cy + rand(-pl.R, pl.R)*0.6,
          a: 0.5, s: Math.random()<0.5?1:2
        });
      }
      pl.trail = pl.trail.filter(d=>{ d.a -= 0.012; return d.a > 0; });
    }

    if (p >= 1){
      phase = 'boom'; phaseT0 = t;
      startBoom(collisionX, collisionY);
      startMerge(t);
      shake = 16;
    }
  }

  if (phase === 'boom' && el > BOOM_MS){
    phase = 'merge'; phaseT0 = t;
  }

  shake *= 0.90;

  if (phase === 'hint' || phase === 'fly' || phase === 'boom'){
    for (const pl of planets){
      for (const d of pl.trail){
        sctx.fillStyle = (pl.hue==='cyan' ? 'rgba(120,240,232,' : 'rgba(255,120,196,') + d.a.toFixed(3) + ')';
        sctx.fillRect(Math.round(d.x), Math.round(d.y), d.s, d.s);
      }
    }
    if (phase !== 'boom'){
      drawDotSphere(planets[0], t);
      drawDotSphere(planets[1], t);
    } else {
      const k = clamp((t - phaseT0)/2100, 0, 1);
      for (const pl of planets){
        const dir = pl === planets[0] ? -1 : 1;
        drawScatterCloud(pl, t, k, dir);
      }
      updateBoom(16, collisionX, collisionY);
      drawMergeBall(t);
    }
  }

  if (phase === 'merge'){
    drawMergeBall(t);
  }
}

function drawScatterCloud(pl, t, k, dir){
  const c = COLOR[pl.hue];
  for (const p of pl.pts){
    const spread = easeInOut(k);
    const sx = pl.cx + (p.x * pl.R) + dir * spread * 180 * (0.28 + Math.abs(p.x)*0.3) + p.x*spread*60;
    const sy = pl.cy + (p.y * pl.R) - spread * 40 * Math.abs(p.y) + p.y*spread*40;
    const a = 1 - k;
    sctx.fillStyle = (p.x + p.z > 0 ? c.core : c.mid).replace('AL', (a*0.7).toFixed(3));
    sctx.fillRect(Math.round(sx), Math.round(sy), 2, 2);
  }
}

function drawSquat(px, pose){

  px(-9, -22, 5, 9, C.skin);

}

function drawSitting(px, pose){
  const headY = 18;
  const swing = pose.legSwing || 0;

  px(-14, -12, 13, 5, C.skin);
  px(1, -12 + swing*2, 13, 5, C.skin);

  px(-18, -13, 6, 8, C.sock);
  px(11, -13 + swing*2, 6, 8, C.sock);

  px(-19, -8, 8, 4, C.shoe);
  px(-19, -6, 8, 2, C.shoeHi);
  px(15, -8 + swing*2, 8, 4, C.shoe);
  px(15, -6 + swing*2, 8, 2, C.shoeHi);

  px(-12, -26 + headY*0.35, 24, 12, C.inner);
  px(-12, -26 + headY*0.35, 24, 2, C.laceS);

  px(-9, -44 + headY*0.75, 18, 16, C.inner);
  px(-14, -44 + headY*0.75, 7, 17, C.hoodie);
  px(7, -44 + headY*0.75, 7, 17, C.hoodie);
  px(-15, -46 + headY*0.75, 29, 4, C.lace);

  px(-19, -34 + headY*0.5, 5, 12, C.hoodie);
  px(-19, -22 + headY*0.5, 4, 4, C.skin);
  px(14, -34 + headY*0.5, 5, 12, C.hoodie);
  px(14, -22 + headY*0.5, 4, 4, C.skin);

  drawHead(px, 0, headY + 2, pose);
}

function renderCharacter(ctx, pose){
  const W2 = ctx.canvas.width, H2 = ctx.canvas.height;
  ctx.clearRect(0,0,W2,H2);

  const px = makePainter(ctx);
  const cx = W2/2 + (pose.walk || 0);
  const cy = H2 - 8 - (pose.hop || 0) + (pose.lift || 0);

  drawShadow(px, cx, cy, pose.crouch || 0);

  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  if (pose.flip) ctx.scale(-1, 1);

  if (pose.sit > 0.5) drawSitting(px, pose);
  else if (pose.crouch > 0.12) drawSquat(px, pose);
  else drawStanding(px, pose);

  ctx.restore();
}

/* =========================================================
   6. 姿态与自主动作
   ========================================================= */
const charCanvas = document.getElementById('char');
const charCtx = charCanvas.getContext('2d');
const charEndCanvas = document.getElementById('charEnd');
const charEndCtx = charEndCanvas.getContext('2d');

function basePose(){
  return {
    walk:0, walkPhase:0, hop:0, lift:0, lean:0, crouch:0, sit:0,
    flip:false, blink:0, mouth:0, arms:'down', legPose:'stand',
    headDx:0, headDy:0, legSwing:0, amt:0
  };
}

let pose = basePose();
let act = { name:'idle', t:0, dur:600 };
let nextActionAt = nowMs() + 2200;
let blinkAt = nowMs() + 900;
let blinkT = 0;
let talkActive = false;
let recentActions = [];

const ACTION_POOL = [
  { n:'lookUp',    d:[900,1400],  gap:[3000,6000] },
  { n:'lookDown',  d:[900,1500],  gap:[3500,7000] },
  { n:'tilt',      d:[1000,1800], gap:[3500,7000] },
  { n:'stretch',   d:[1600,2400], gap:[9000,16000] },
  { n:'touchHair', d:[1200,2000], gap:[6000,12000] },
  { n:'yawn',      d:[1400,2200], gap:[8000,15000] },
  { n:'wave',      d:[1100,1800], gap:[7000,13000] },
  { n:'sway',      d:[2200,3600], gap:[5000,10000] },
  { n:'hop',       d:[600,900],   gap:[6000,12000] },
  { n:'bag',       d:[1200,1800], gap:[7000,13000] },
  { n:'shift',     d:[1800,2800], gap:[5000,9000] },
  { n:'squat',     d:[3200,5200], gap:[11000,20000] },
  { n:'walk',      d:[3000,5200], gap:[8000,16000] },
  { n:'sitSwing',  d:[3600,5600], gap:[15000,26000] },
  { n:'oneLeg',    d:[1600,2600], gap:[8000,15000] },
  { n:'tiptoe',    d:[1200,1800], gap:[8000,15000] },
  { n:'halfSquat', d:[1600,2400], gap:[9000,16000] },
  { n:'turn',      d:[900,1300],  gap:[8000,15000] },
  { n:'footTap',   d:[2200,3400], gap:[8000,15000] },
  { n:'shade',     d:[1800,2800], gap:[9000,16000] },
  { n:'akimbo',    d:[2000,3000], gap:[9000,16000] },
  { n:'pat',       d:[1600,2400], gap:[9000,16000] },
  { n:'scratch',   d:[1600,2400], gap:[10000,18000] },
  { n:'strap',     d:[1400,2200], gap:[7000,13000] },
  { n:'scan',      d:[1800,2600], gap:[8000,14000] }
];

function pickAction(){
  let pool = ACTION_POOL.filter(a=> recentActions.indexOf(a.n) === -1);
  if (!pool.length) pool = ACTION_POOL;
  return pool[randInt(0, pool.length-1)];
}

function triggerAction(){
  const a = pickAction();
  act = { name: a.n, t: 0, dur: rand(a.d[0], a.d[1]) };
  recentActions.push(a.n);
  if (recentActions.length > 4) recentActions.shift();
  nextActionAt = nowMs() + act.dur + rand(a.gap[0], a.gap[1]);
}

function updatePose(t){
  const p = basePose();
  p.hop = Math.sin(t/1100) * 0.9;

  if (act.name !== 'idle'){
    act.t += 16;
    const prog = clamp(act.t / act.dur, 0, 1);
    const k = Math.sin(Math.PI * prog);

    switch (act.name){
      case 'lookUp':    p.headDy = -2 * k; break;
      case 'lookDown':  p.headDy = 2.5 * k; break;
      case 'tilt':      p.headDx = 3 * k; break;
      case 'stretch':   p.arms = 'up'; p.amt = 6*k; p.lean = -1.6*k; p.hop = -2.4*k; break;
      case 'touchHair': p.arms = 'hair'; break;
      case 'yawn':      p.arms = 'yawn'; p.mouth = k > 0.35 ? 1 : 0; break;
      case 'wave':      p.arms = 'wave'; p.amt = 4*k; break;
      case 'sway':      p.lean = Math.sin(prog*Math.PI*4) * 2.2; break;
      case 'hop':       p.hop = -7*k; break;
      case 'bag':       p.arms = 'bag'; break;
      case 'shift':     p.lean = 2.4*k; p.hop = 0.6*k; break;
      case 'squat':     p.crouch = k; p.arms = 'hugknee'; break;
      case 'walk':
        p.walk = Math.sin(prog * Math.PI * 3.2) * 15;
        p.legPose = 'walk';
        p.walkPhase = prog * Math.PI * 14;
        p.hop += Math.abs(Math.sin(p.walkPhase)) * -1.2;
        break;
      case 'sitSwing':
        p.sit = 1;
        p.legSwing = Math.sin(prog * Math.PI * 6) * 2.2;
        break;
      case 'oneLeg':    p.legPose = 'oneleg'; p.lean = 1.2*k; break;
      case 'tiptoe':    p.legPose = 'tiptoe'; p.hop = -2.2*k; break;
      case 'halfSquat': p.crouch = 0.42*k; break;
      case 'turn':      p.flip = prog > 0.5; break;
      case 'footTap':   p.legPose = 'tap'; p.walkPhase = prog * Math.PI * 10; break;
      case 'shade':     p.arms = 'shade'; p.headDy = -1; break;
      case 'akimbo':    p.arms = 'hip'; p.lean = 1.4*k; break;
      case 'pat':       p.arms = 'pat'; p.amt = Math.sin(prog*Math.PI*6)*2; break;
      case 'scratch':   p.arms = 'scratch'; p.headDx = -1.5*k; break;
      case 'strap':     p.lean = Math.sin(prog*Math.PI*6)*1.4; break;
      case 'scan':      p.headDx = Math.sin(prog*Math.PI*2)*4; break;
    }

    if (prog >= 1) act = { name:'idle', t:0, dur:600 };
  } else {
    p.lean = Math.sin(t/2600) * 0.9;
    if (t > nextActionAt) triggerAction();
  }

  if (t > blinkAt){ blinkT = 1; blinkAt = t + rand(2400, 5600); }
  if (blinkT > 0){
    blinkT -= 0.16;
    p.blink = clamp(1 - Math.abs(blinkT - 0.5)*2, 0, 1);
  }

  pose = p;
}

   7. 对话
   ========================================================= */
let li = -1;
let typing = false;
let typingTimer = null;

function buildDots(){
  dotsEl.innerHTML = '';
  INTRO.forEach((_, i)=>{
    const d = document.createElement('i');
    if (i <= li) d.className = 'on';
    dotsEl.appendChild(d);
  });
}

function typeLine(text){
  typing = true;
  caretEl.style.display = 'inline-block';
  lineText.textContent = '';
  let i = 0;
  clearInterval(typingTimer);
  typingTimer = setInterval(()=>{
    i++;
    lineText.textContent = text.slice(0, i);
    if (i >= text.length){
      clearInterval(typingTimer);
      typing = false;
    }
  }, 32);
}

function showLine(i){
  const item = INTRO[i];
  li = i;
  stageTag.textContent = item.stage;
  buildDots();
  typeLine(item.text);
}

function beginTalk(){
  talkActive = true;
  nextActionAt = nowMs() + 1600;
  showLine(0);
}

function advance(){
  if (typing){
    clearInterval(typingTimer);
    lineText.textContent = INTRO[li].text;
    typing = false;
    return;
  }
  if (li + 1 < INTRO.length) showLine(li + 1);
  else showEnding();
}

talkEl.addEventListener('pointerdown', (e)=>{
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = e.clientX + 'px';
  r.style.top = e.clientY + 'px';
  document.body.appendChild(r);
  setTimeout(()=> r.remove(), 720);

  act = { name:'idle', t:0, dur:400 };
  nextActionAt = nowMs() + rand(1800, 3200);
  pose.mouth = 1;
  setTimeout(()=> { pose.mouth = 0; }, 260);

  advance();
});

   8. 结尾汇总
   ========================================================= */
function buildEnding(){
  groupsEl.innerHTML = '';
  const map = new Map();
  INTRO.forEach(item=>{
    if (!map.has(item.stage)) map.set(item.stage, []);
    map.get(item.stage).push(item.text);
  });
  map.forEach((lines, stage)=>{
    const div = document.createElement('div');
    div.className = 'group';
    const t = document.createElement('div');
    t.className = 'gtitle';
    t.textContent = stage;
    div.appendChild(t);
    lines.forEach(txt=>{
      const p = document.createElement('p');
      p.className = 'gline';
      p.textContent = txt;
      div.appendChild(p);
    });
    groupsEl.appendChild(div);
  });
}

function showEnding(){
  talkActive = false;
  clearInterval(typingTimer);
  buildEnding();
  talkEl.classList.remove('show');
  setTimeout(()=> talkEl.classList.add('hidden'), 400);
  endingEl.classList.remove('hidden');
  requestAnimationFrame(()=>{
    endingEl.classList.add('show');
    fitEnding();
  });
  setTimeout(fitEnding, 160);
  setTimeout(fitEnding, 420);
  phase = 'ending';
}

/* 结尾页自适应：内容超出可视高度时整体等比缩小，保证不裁切、不出现滚动条 */
function fitEnding(){
  const right = endingEl.querySelector('.ending-right');
  if (!right) return;
  right.style.transform = '';
  const avail = Math.max(80, endingEl.clientHeight - 14);
  const need = right.scrollHeight;
  if (need > avail){
    const k = Math.max(0.55, (avail / need) * 0.97);
    right.style.transformOrigin = 'center center';
    right.style.transform = 'scale(' + k.toFixed(3) + ')';
  }
}

let lastTap = 0;
endingEl.addEventListener('pointerdown', ()=>{
  const t = nowMs();
  if (t - lastTap < 320) restart();
  lastTap = t;
});

function restart(){
  li = -1; typing = false; talkActive = false;
  clearInterval(typingTimer);
  mergeBall = null;
  endingEl.classList.remove('show');
  setTimeout(()=> endingEl.classList.add('hidden'), 400);
  resetPlanetPositions();
  boom = null;
  phase = 'fly'; phaseT0 = nowMs();
  talkEl.classList.add('hidden');
  talkEl.classList.remove('show');
  applyOrientation();
}

/* =========================================================
   9. 渲染循环
   ========================================================= */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, Math.round(space.offsetWidth || window.innerWidth));
  H = Math.max(1, Math.round(space.offsetHeight || window.innerHeight));
  space.width = Math.round(W * DPR);
  space.height = Math.round(H * DPR);
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars();
  buildNebula();
  resetPlanetPositions();
}

/* 竖屏设备：提示停留结束后把整个页面旋转 90°，强制横屏铺满；横屏设备保持原样 */
function applyOrientation(){
  const portrait = window.matchMedia('(orientation:portrait)').matches;
  const started = (phase !== 'hint');
  document.body.classList.toggle('rotd', portrait && started);
  resize();
  if (phase === 'ending') setTimeout(fitEnding, 80);
}

function endingPose(t){
  const p = basePose();
  p.hop = Math.sin(t/1400) * 0.8;
  p.lean = Math.sin(t/3000) * 0.8;
  if (t > blinkAt){ blinkT = 1; blinkAt = t + rand(2600, 6000); }
  if (blinkT > 0){
    blinkT -= 0.16;
    p.blink = clamp(1 - Math.abs(blinkT - 0.5)*2, 0, 1);
  }
  return p;
}

function loop(t){
  if (nebulaCache) sctx.drawImage(nebulaCache, 0, 0, W, H);
  else { sctx.fillStyle = '#05060D'; sctx.fillRect(0,0,W,H); }
  drawStars(t);

  const sx = (Math.random()-0.5) * shake;
  const sy = (Math.random()-0.5) * shake;
  sctx.save();
  sctx.translate(sx, sy);
  tickPhases(t);
  sctx.restore();

  updatePose(t);
  if (talkActive) renderCharacter(charCtx, pose);
  if (phase === 'ending') renderCharacter(charEndCtx, endingPose(t));

  requestAnimationFrame(loop);
}

applyOrientation();
phaseT0 = nowMs();

/* =========================================================
   9. 小游戏：捡星星 + 今日塔罗
   ========================================================= */
const gameStarsEl = document.getElementById('gameStars');
const gameTarotEl = document.getElementById('gameTarot');
const starsCv = document.getElementById('starsCv');
const starsCtx = starsCv.getContext('2d');
const starsScoreEl = document.getElementById('starsScore');
const starsTimeEl = document.getElementById('starsTime');
const starsMsgEl = document.getElementById('starsMsg');
const openStarsBtn = document.getElementById('openStars');
const openTarotBtn = document.getElementById('openTarot');

let starsGame = null;
let fingerX = null;   // 手指在视觉坐标里的位置

function closeAllGames(){
  if (starsGame){ cancelAnimationFrame(starsGame.raf); starsGame = null; }
  gameStarsEl.classList.add('hidden');
  gameTarotEl.classList.add('hidden');
  fingerX = null;
}
document.querySelectorAll('[data-close]').forEach(btn=>{
  btn.addEventListener('click', (e)=>{ e.stopPropagation(); closeAllGames(); });
});

/* 游戏层自己在 portrait 下旋转了 90°，所以用 portrait 判定而不是 body.rotd */
function isPortrait(){ return window.innerHeight > window.innerWidth; }
function gameDims(){
  const p = isPortrait();
  return {
    rotd: p,
    vW: p ? starsCv.clientHeight : starsCv.clientWidth,
    vH: p ? starsCv.clientWidth  : starsCv.clientHeight
  };
}
function toCanvas(vx, vy){
  if (isPortrait()) return { x: vy, y: starsCv.clientHeight - vx };
  return { x: vx, y: vy };
}
function resizeStars(){
  const dpr = window.devicePixelRatio || 1;
  starsCv.width = starsCv.clientWidth * dpr;
  starsCv.height = starsCv.clientHeight * dpr;
  starsCtx.setTransform(dpr,0,0,dpr,0,0);
}
function drawStar(ctx, x, y, r){
  ctx.beginPath();
  for (let i=0;i<5;i++){
    const a = -Math.PI/2 + i*Math.PI*2/5;
    const a2 = a + Math.PI/5;
    ctx.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
    ctx.lineTo(x + Math.cos(a2)*r*0.45, y + Math.sin(a2)*r*0.45);
  }
  ctx.closePath();
  ctx.fill();
}

/* 游戏层在 portrait 下自己旋转了 90°，视觉上就是横屏铺满屏幕，
   所以视觉 x 直接等于屏幕 clientX，不需要额外换算 */
openStarsBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  closeAllGames();
  gameStarsEl.classList.remove('hidden');
  requestAnimationFrame(()=> gameStarsEl.classList.add('show'));
  resizeStars();
  const { vW, vH } = gameDims();
  starsGame = {
    vx: vW/2, items: [], score: 0, lives: 3,
    timeLeft: 20, lastSpawn: 0,
    lastT: performance.now(), raf: 0, over: false
  };
  starsScoreEl.textContent = '0';
  starsTimeEl.textContent = '20';
  starsMsgEl.classList.remove('show');
  fingerX = vW/2;
  loopStars();
});

/* 跟随手指：pointerdown / 按住时 pointermove 都更新 fingerX */
function onStarsPointer(e){
  if (!starsGame) return;
  fingerX = e.clientX;   // 视觉 x = 屏幕 x（游戏层已旋转铺满）
}
starsCv.addEventListener('pointerdown', onStarsPointer);
starsCv.addEventListener('pointermove', (e)=>{
  if (e.buttons > 0) onStarsPointer(e);
});
window.addEventListener('pointerup', ()=>{ fingerX = null; });
window.addEventListener('pointercancel', ()=>{ fingerX = null; });

function loopStars(){
  if (!starsGame) return;
  const g = starsGame;
  const now = performance.now();
  const dt = Math.min(0.05, (now - g.lastT)/1000);
  g.lastT = now;
  const { vW, vH } = gameDims();

  /* 手指跟随 + lerp 平滑 */
  if (fingerX != null){
    const target = Math.max(24, Math.min(vW - 24, fingerX));
    g.vx += (target - g.vx) * Math.min(1, dt * 14);
  }
  g.vx = Math.max(24, Math.min(vW - 24, g.vx));

  g.lastSpawn += dt;
  if (g.lastSpawn > 0.5){
    g.lastSpawn = 0;
    g.items.push({
      vx: 30 + Math.random()*(vW-60), vy: -10,
      vySpeed: 130 + Math.random()*130,
      r: 5 + Math.random()*3,
      pink: Math.random() < 0.3
    });
  }

  const catchY = vH - 46;
  g.items = g.items.filter(it=>{
    it.vy += it.vySpeed * dt;
    if (Math.abs(it.vy - catchY) < 22 && Math.abs(it.vx - g.vx) < 32){
      g.score++;
      starsScoreEl.textContent = g.score;
      blip(1200 + Math.random()*400, 0.08, 'sine', 0.22);
      return false;
    }
    if (it.vy > vH + 10){
      g.lives--;
      if (g.lives <= 0) endStars();
      return false;
    }
    return true;
  });

  g.timeLeft -= dt;
  starsTimeEl.textContent = Math.max(0, Math.ceil(g.timeLeft));
  if (g.timeLeft <= 0) endStars();

  starsCtx.clearRect(0,0,starsCv.clientWidth, starsCv.clientHeight);
  for (const it of g.items){
    const c = toCanvas(it.vx, it.vy);
    starsCtx.fillStyle = it.pink ? 'rgba(255,168,203,.95)' : 'rgba(159,232,226,.95)';
    drawStar(starsCtx, c.x, c.y, it.r);
  }
  /* 像素小人：身体 + 头 + 腿，横屏时也好看 */
  const p = toCanvas(g.vx, catchY);
  starsCtx.fillStyle = '#f7ddcb';
  starsCtx.fillRect(p.x - 9, p.y - 18, 18, 16);
  starsCtx.fillStyle = '#7c98a6';
  starsCtx.fillRect(p.x - 10, p.y - 26, 20, 9);
  starsCtx.fillStyle = '#1b1d24';
  starsCtx.fillRect(p.x - 8, p.y - 2, 16, 4);
  /* 接住区域的小光条 */
  starsCtx.fillStyle = 'rgba(159,232,226,.35)';
  starsCtx.fillRect(p.x - 18, p.y - 3, 36, 2);

  if (!g.over) g.raf = requestAnimationFrame(loopStars);
}

function endStars(){
  if (!starsGame || starsGame.over) return;
  starsGame.over = true;
  const g = starsGame;
  starsMsgEl.textContent = `结束 · 接到 ${g.score} 颗星星 ✨`;
  starsMsgEl.classList.add('show');
  setTimeout(()=>{
    cancelAnimationFrame(g.raf);
    starsGame = null;
    gameStarsEl.classList.add('hidden');
  }, 1800);
}
